# Copie para .github/ISSUE_TEMPLATE/tarefa.yml (e crie ao lado um config.yml com `blank_issues_enabled: false`).
name: Tarefa
description: Uma tarefa para uma sessão Builder (veja o documento de desenvolvimento do projeto)
title: "[tarefa] "
labels: ["tarefa"]
body:
  - type: markdown
    attributes:
      value: |
        A Lead classifica o impacto e integra na `main`. Quando a tarefa for delegada, a Builder executa.
  - type: input
    id: impacto
    attributes:
      label: Impacto e motivo
      description: Básico, Padrão ou Profundo. Indique quem pode ser afetado, por quê e qual portão se aplica.
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ficar pronto, em poucas frases, e por quê.
    validations:
      required: true
  - type: input
    id: requisitos
    attributes:
      label: Requisitos (R-xx)
      description: Cite os IDs de processo/requisitos.md ou informe "sem R-xx aplicável". Requisito novo passa pela pessoa.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Como a Lead vai saber que está certo. Cite a referência (uma seção, um comportamento, um documento) quando houver.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: arquivos_permitidos
    attributes:
      label: Arquivos que a tarefa PODE tocar
    validations:
      required: true
  - type: textarea
    id: arquivos_proibidos
    attributes:
      label: Arquivos que a tarefa NÃO pode tocar
      description: Os que outra tarefa está mexendo ou que são congelados.
    validations:
      required: true
  - type: textarea
    id: testes_micro
    attributes:
      label: Verificação do ajuste (micro)
      description: Informe a evidência esperada. Para mudança de comportamento ou correção de bug, escreva o teste antes do código.
    validations:
      required: true
  - type: textarea
    id: testes_macro
    attributes:
      label: Testes macro esperados
      description: Indique o CI obrigatório e as verificações de regressão proporcionais à trilha.
    validations:
      required: true
  - type: input
    id: plano
    attributes:
      label: Plano e passo
      description: Quando houver plano, informe o link e o passo. Para trabalho simples, registre o aceite e as verificações na issue.
  - type: input
    id: dependencias
    attributes:
      label: Dependências
      description: Issues ou contratos que precisam estar prontos antes desta tarefa. Preencha quando houver.
  - type: input
    id: ferramenta
    attributes:
      label: Ferramenta
      description: Claude Code ou Codex (a do papel na tabela Ferramenta por papel, ou a outra se a cota apertou) e o nome da Builder, como "Backend Builder #12 · login · Codex".
    validations:
      required: true
  - type: input
    id: sessao
    attributes:
      label: Sessão e worktree
      description: Preencha ao começar (branch, pasta e porta que o script mostrou).
